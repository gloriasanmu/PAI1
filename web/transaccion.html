<!doctype HTML>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="images/favicon.ico">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script src="js/libs/bootstrap.min.js"></script>
    <script src="js/libs/axios.min.js"></script>
    <script src="js/utils/include.js"></script>

    <title>Nueva transacción</title>
</head>

<body>
    <div id="page-header"></div>

    <div class="container">
        <div class="row" id="errors"></div>

        <div class="row">
            <div class="col-md text-center">
                <h3>Nueva transacción</h3>
            </div>
        </div>

        <hr>

        <form id="transaccion-form">
            <div class="row mb-4">
                <div class="col-md">
                    <div class="form-group">
                        <label for="username">Destino:</label>
                        <div class="input-group">
                            <input required type="text" class="form-control" id="username" name="username"
                                placeholder="username">
                        </div>
                    </div>
                </div>

                <div class="col-md">
                    <div class="form-group">
                        <label for="money">Cantidad:</label>
                        <input required type="number" step="0.01" min="0" class="form-control" id="money" name="money"
                            placeholder="0.00">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md text-center">
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </div>
            </div>
        </form>

    </div>
    </div>

    <div id="page-footer"></div>

    <script>
        include("header.html", "#page-header");
        include("footer.html", "#page-footer");
    </script>

    <script type="module" src="js/header.js"></script>
    <script type="module" src="js/transaccion.js"></script>

</body>

</html>
